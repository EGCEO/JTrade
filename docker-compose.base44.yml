services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["python", "run.py"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
